<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add transaction - SmartBudget</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Menu -->
  <header class="menu">
    <a class="logo" href="/"><span class="logo-mark"></span>SmartBudget</a>
    <nav class="links">
      <a href="/">Overview</a>
      <a href="/transactions">Transactions</a>
      <a href="/add" class="active">Add</a>
      <a href="/budget">Budget</a>
    </nav>
    <div class="menu-right">
      <select id="theme" aria-label="Theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="green">Green</option>
        <option value="pink">Pink</option>
      </select>
      <div class="avatar">{{ session["username"][0]|upper }}</div>
      <span class="who">{{ session["username"] }}</span>
      <a href="/logout">Log out</a>
    </div>
  </header>

  <main class="page">

    {% for message in get_flashed_messages() %}
      <p class="message">{{ message }}</p>
    {% endfor %}

    <h1>Add transaction</h1>
    <p class="subtitle">Write down money you got or money you spent.</p>

    <form class="box" method="post">

      <label>Type</label>
      <div class="segmented">
        <div class="segmented-option">
          <input type="radio" id="type-expense" name="type" value="expense" checked>
          <label for="type-expense">Expense</label>
        </div>
        <div class="segmented-option">
          <input type="radio" id="type-income" name="type" value="income">
          <label for="type-income">Income</label>
        </div>
      </div>

      <label for="amount">Amount (kr)</label>
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>

      <label for="category">Category</label>
      <select id="category" name="category_id">
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>

      <label for="date">Date</label>
      <input id="date" name="date" type="date" value="{{ today }}" required>

      <label for="description">Note (optional)</label>
      <input id="description" name="description" type="text" maxlength="200">
      <p class="hint"><span id="note-count">0</span> / 200</p>

      <button class="button" type="submit">Save transaction</button>
    </form>

  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/form.js"></script>
</body>
</html>
