<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - SmartBudget</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="auth-layout">

    <!-- Coloured panel -->
    <div class="auth-side">
      <div class="auth-logo">SmartBudget</div>
      <h2 class="auth-title">Know where your money goes.</h2>
      <ul class="auth-points">
        <li>Write down what you get and what you spend</li>
        <li>Set a monthly budget</li>
        <li>Get a warning before you run out</li>
      </ul>
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
    </div>

    <!-- Login form -->
    <div class="auth-main">
      <div class="box">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to see your budget.</p>

        {% for message in get_flashed_messages() %}
          <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="post">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autofocus>

          <label for="password">Password</label>
          <div class="password-box">
            <input id="password" name="password" type="password" required>
            <button class="button button-light show-password" type="button" data-target="password">Show</button>
          </div>

          <button class="button" type="submit">Log in</button>
        </form>

        <p class="auth-switch">No account yet? <a href="/register">Create one</a></p>
      </div>
    </div>

  </div>

  <script src="/static/theme.js"></script>
  <script src="/static/common.js"></script>
</body>
</html>
